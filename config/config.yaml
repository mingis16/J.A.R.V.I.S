# No secrets in this file. Credentials come from .env / environment variables.

trading:
  symbol: "EURUSDm"  # this broker (Exness) suffixes symbols with "m" on this account type
  timeframe: "M15"
  fast_ema_period: 12
  slow_ema_period: 26
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  atr_period: 14
  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  risk_per_trade_pct: 1.0    # low end of the requested 1-2% band for a fresh live account
  max_daily_loss_pct: 2.0    # tightened from 3.0 — halts new signals for the rest of the UTC day once tripped
  max_open_positions: 1
  poll_seconds: 30
  history_bars: 300

execution:
  # Hard-gated: even when true, a real order additionally requires the
  # JARVIS_CONFIRM_LIVE env var to be set. See trading_bot/executor.py.
  live_trading: false
  magic_number: 20260910
  deviation_points: 20
  order_comment: "jarvis-bot"

assistant:
  model: "claude-opus-5"
  max_tokens: 16000
  memory_path: "state/memory.json"
  trade_log_path: "state/trades.jsonl"
  command_audit_path: "state/command_audit.log"
  max_tool_iterations: 25

voice:
  name: "Alex"
  wake_word: "hey alex"
  sample_rate: 16000
  # Local speech-to-text (faster-whisper). "base" is a good CPU speed/accuracy
  # tradeoff; use "small"/"medium" for better accuracy if you have a GPU.
  whisper_model: "base"
  whisper_device: "cpu"
  whisper_compute_type: "int8"
  # Voice activity detection tuning for segmenting mic input into utterances.
  vad_silence_multiplier: 3.0
  vad_min_speech_ms: 200
  vad_silence_hangover_ms: 800
  active_listen_timeout_s: 15
  # Text-to-speech. "pyttsx3" = offline Windows SAPI voice, no API key.
  # Swap to an ElevenLabs-backed engine later without touching voice_assistant.py.
  tts_engine: "pyttsx3"
  tts_rate: 180
  tts_voice_id: null

trading_desk:
  # Alex's autonomous trading desk (assistant/trading_desk/), run by the daemon
  # once an hour inside session_hours_utc. Alex decides; code enforces `limits`
  # and sizes every position. Real orders require live: true here AND
  # JARVIS_CONFIRM_LIVE=YES_I_UNDERSTAND_THE_RISK in .env — otherwise every
  # trade is paper-logged only. Every trade is pushed to Telegram.
  enabled: true
  live: true
  symbols: ["EURUSD", "GBPUSD", "USDJPY", "XAUUSD"]  # base names; the account's suffix (m/c) is found automatically
  session_hours_utc: [7, 20]   # London open to NY afternoon; SL/TP stay on the broker outside these hours
  run_at_minute: 2             # just after each H1 candle closes
  max_cycles_per_day: 16       # API-spend guard
  paper_equity: 1000.0         # sizing balance in paper mode (account currency) — mirrors $10 = 1000 USC on a Cent account
  magic_number: 20261001
  order_comment: "alex-desk"
  deviation_points: 20
  journal_entries_in_brief: 6
  model: "claude-opus-5-5"
  effort: "low"                # low keeps each hourly decision cheap; raise to "medium" for more deliberate analysis
  price_per_mtok: {input: 4.0, output: 20.0}  # for the spend estimate in logs/trading_desk.jsonl; Sonnet 5.5 is 2/10
  limits:                      # chosen by the user 2026-10-01 — Alex cannot change these
    risk_per_trade_pct: 2.0
    max_daily_loss_pct: 6.0
    max_open_positions: 2
    max_trades_per_day: 5
    min_reward_risk: 1.0

telegram:
  # Push a message for every new trade log entry (paper or live) to every
  # TELEGRAM_ALLOWED_USER_IDS. Token/allowlist live in .env, not here.
  notify_on_trade: true

dashboard:
  # Local-only web chat UI (scripts/run_dashboard.py). Bound to 127.0.0.1 —
  # never exposed to the network — since Alex has real shell/file access.
  port: 5000

daemon:
  # Background scheduler (scripts/run_daemon.py). Fixed checks run
  # automatically; anything that would change state (code, config, a
  # running process, a trade) is written to proposals_path for the user to
  # review and explicitly approve later — never auto-executed unattended.
  trading_bot_health_check_interval_s: 900
  signal_engine_check_interval_s: 3600  # hourly, matching signal_engine's H1 timeframe
  # Set to an absolute repo path to enable dev_agent_routine. Left null,
  # that routine is a documented no-op.
  dev_project_path: null
  dev_agent_interval_s: 21600
  # 24h local time (HH:MM) at which the overnight_summary routine runs.
  overnight_summary_time: "07:00"
  log_path: "logs/daemon.log"
  proposals_path: "logs/proposals.jsonl"

signal_engine:
  # Calibrated signal research pipeline (scripts/run_signal_engine.py).
  # Standalone from trading/execution above — does not affect live/paper
  # trading. See signal_engine/REPORT.md (generated by --train) for results
  # and signal_engine/data_loader.py for the confirmed MT5 history ceiling.
  pairs: ["EURUSDm", "GBPUSDm", "USDJPYm"]  # "m" suffix — this Exness account's symbol naming
  timeframe: "H1"
  history_bars: 40000  # this account gives ~33.5k bars (~8.2 years), well past the 5-year target
  horizon_bars: 24          # 1 trading day on H1; triple-barrier lookahead window
  atr_sl_mult: 1.5
  atr_tp_mult: 3.0          # risk:reward = 2.0
  probability_threshold: 0.5  # well above the ~0.33 breakeven for RR=2
  spread_slippage_mult: 1.5   # slippage assumed as 50% more than raw spread
  commission_r: 0.0
  n_folds: 6
  embargo_bars: 24
  min_train_bars: 5000
  cache_dir: "signal_engine/cache"
  report_dir: "signal_engine"
